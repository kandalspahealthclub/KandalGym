<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KandalGym - Personal Trainer & Planeamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=30">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KandalGym">
    <link rel="apple-touch-icon" href="logo.png">
 
    <!-- Firebase SDKs (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    <!-- QR Code & Scanner Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="login-screen" class="login-overlay"></div>

    <div id="app" style="display: none; opacity: 0; transition: opacity 0.5s ease;">
        <header class="glass-panel">
            <div class="logo">
                <img src="logo.png" alt="KandalGym Logo">
            </div>
            <div class="user-profile" id="user-profile-header"></div>
        </header>

        <main>
            <aside class="sidebar glass-panel" id="sidebar"></aside>

            <section class="content-area" id="main-content">
                <div class="loader">Carregando...</div>
            </section>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js?v=620"></script>

    <!-- Google Translate Widget -->
    <div id="google_translate_element" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; background: rgba(10, 10, 10, 0.8); border-radius: 8px; padding: 5px; border: 1px solid var(--surface-border, #333); backdrop-filter: blur(10px);"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'pt', 
                includedLanguages: 'en,pt,es,fr', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <style>
        /* Esconder a barra de topo do Google Translate */
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        } 
        body {
            top: 0px !important; 
        }
        /* Estilizar o dropdown do widget */
        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: none !important;
            color: #fff !important;
            font-family: 'Outfit', sans-serif !important;
        }
        .goog-te-gadget-simple .goog-te-menu-value {
            color: #fff !important;
        }
        .goog-te-gadget-simple .goog-te-menu-value span {
            color: #fff !important;
        }
        .goog-te-gadget-icon {
            display: none !important; /* Esconder icone padrão do google */
        }
    </style>
</body>

</html>
